[package]
name = "fltr-rpf-core"
version = "1.2.0"
edition = "2024"
description = "RPF7/RSC7 archive and GTA V resource (ytd, ydr, ypt, gfx, meta) reading and in-place editing for fltr-rpf"
authors = ["Talkdedsec", "Fivemleaktr"]
license = "GPL-3.0-only"
repository = "https://github.com/kyvex372/FLTR-Fivem-Rpf-Editor-Creator"
publish = false

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga"] }
fast_image_resize = { version = "6", features = ["image"] }
intel_tex_2 = "0.5"
bcdec_rs = "0.2"
texpresso = { version = "2", features = ["rayon"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rage-formats = "0.2"
