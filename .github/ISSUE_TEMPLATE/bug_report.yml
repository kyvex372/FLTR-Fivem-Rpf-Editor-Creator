name: Hata bildir
description: FLTR uygulamasında karşılaştığın bir sorunu bildir.
title: "[Hata] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Burası herkese açıktır. API anahtarı, kişisel dosya ve özel sunucu bilgisi paylaşma. Güvenlik açıklarını Security bölümünden özel bildir."
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü ve Windows sürümü
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Sorunu nasıl oluşturabiliriz?
      description: Yaptığın işlemi, beklenen sonucu ve gerçekleşen sonucu yaz.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Hata mesajı veya ekran görüntüsü
      description: Kişisel yolları ve gizli bilgileri paylaşmadan önce kaldır.
