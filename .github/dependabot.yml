version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      tauri:
        patterns: ["tauri*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      codemirror:
        patterns: ["@codemirror/*", "codemirror"]
      tauri:
        patterns: ["@tauri-apps/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
