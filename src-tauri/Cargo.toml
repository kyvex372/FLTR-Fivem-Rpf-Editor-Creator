[package]
name = "fltr-rpf"
version = "1.2.0"
edition = "2024"
description = "FiveM mods folder editor: textures, visual settings, effects, models and maps inside .rpf archives"
authors = ["Talkdedsec", "Fivemleaktr"]
license = "GPL-3.0-only"
repository = "https://github.com/kyvex372/FLTR-Fivem-Rpf-Editor-Creator"
publish = false

[lib]
name = "fltr_rpf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fltr-rpf-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# API anahtarlarÄ± Windows Kimlik Bilgisi YÃ¶neticisi'nde
[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
